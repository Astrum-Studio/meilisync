repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --all-extras ty check meilisync tests conftest.py
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run --all-extras pytest -m "not integration"
        language: system
        pass_filenames: false
        types: [python]
