[project]
name = "meilisync"
version = "0.1.5"
description = "Realtime sync data from MySQL/PostgreSQL/MongoDB to meilisearch"
readme = "README.md"
authors = [
    { name = "astrum", email = "hello@astrum.studio" }
]
license = { text = "Apache-2.0" }
repository = "https://github.com/long2ice/meilisync.git"
documentation = "https://github.com/meilisync/meilisync"
keywords = ["meilisearch", "postgres", "mysql", "mongodb", "sync"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.9"
dependencies = [
    "aiofiles>=24.1.0",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.10",
    "meilisearch-python-sdk>=4.4.0",
    "pyyaml>=6.0.2",
    "redis>=5.2.1",
    "typer>=0.15.2",
    "pydantic-settings>=2.8.1",
]

[project.optional-dependencies]
mongodb = ["motor>=3.7.0"]
mysql = ["asyncmy>=0.2.10"]
postgres = ["psycopg2-binary>=2.9.10"]
redis = ["redis>=5.2.1"]
sentry = ["sentry-sdk>=2.26.0"]
all = [
    "motor>=3.7.0",
    "psycopg2-binary>=2.9.10",
    "sentry-sdk>=2.26.0",
]

[project.urls]
Homepage = "https://github.com/meilisync/meilisync"
Repository = "https://github.com/meilisync/meilisync.git"

[project.scripts]
meilisync = "meilisync.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
