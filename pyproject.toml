[project]
name = "meilisync"
dynamic = ["version"]
description = "Realtime sync from PostgreSQL, MySQL, and MongoDB to Meilisearch"
readme = "README.md"
authors = [
    { name = "Astrum Studio", email = "hello@astrum.studio" },
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "meilisearch",
    "postgres",
    "mysql",
    "mongodb",
    "cdc",
    "replication",
    "sync",
    "search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=24.1.0",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.10",
    "meilisearch-python-sdk>=4.4.0",
    "pyyaml>=6.0.2",
    "redis>=5.2.1",
    "typer>=0.15.2",
    "pydantic-settings>=2.8.1",
]

[project.optional-dependencies]
mysql = ["asyncmy>=0.2.10"]
mongodb = ["motor>=3.7.0"]
mongo = ["motor>=3.7.0"]
postgres = ["psycopg2-binary>=2.9.10"]
redis = ["redis>=5.2.1"]
sentry = ["sentry-sdk>=2.26.0"]
all = [
    "asyncmy>=0.2.10",
    "motor>=3.7.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.1",
    "sentry-sdk>=2.26.0",
]

[project.urls]
Homepage = "https://github.com/Astrum-Studio/meilisync"
Documentation = "https://astrum-studio.github.io/meilisync/"
Repository = "https://github.com/Astrum-Studio/meilisync"
Changelog = "https://github.com/Astrum-Studio/meilisync/blob/dev/CHANGELOG.md"
Issues = "https://github.com/Astrum-Studio/meilisync/issues"

[project.scripts]
meilisync = "meilisync.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "meilisync/version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/meilisync",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["meilisync"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "hatch>=1.14.0",
    "pre-commit>=4.3.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
docs = [
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["meilisync", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live MySQL, PostgreSQL, MongoDB, and Meilisearch",
]
