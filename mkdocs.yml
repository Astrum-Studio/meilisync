site_name: meilisync
site_description: Realtime sync from PostgreSQL, MySQL, and MongoDB to Meilisearch
site_url: https://astrum-studio.github.io/meilisync/
repo_url: https://github.com/Astrum-Studio/meilisync
repo_name: Astrum-Studio/meilisync
edit_uri: edit/dev/docs/
copyright: Copyright &copy; 2026 <a href="https://astrum.agency">Astrum Agency</a> &mdash; Apache-2.0

theme:
  name: material
  font: false
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            merge_init_into_class: true

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Installation: install.md
      - Configuration: configuration.md
      - CLI: cli.md
      - Docker: docker.md
      - Plugins: plugins.md
  - Sources:
      - Overview: sources/index.md
      - PostgreSQL: sources/postgres.md
      - MySQL: sources/mysql.md
      - MongoDB: sources/mongodb.md
  - Reference:
      - Progress: progress.md
      - API: api.md
      - Changelog: changelog.md
  - Development:
      - Contributing: contributing.md
      - Publishing: publishing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: material/web
      link: https://astrum.agency
      name: Astrum Agency
    - icon: fontawesome/brands/github
      link: https://github.com/Astrum-Studio/meilisync
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/meilisync/
      name: PyPI

extra_css:
  - assets/css/custom.css

watch:
  - meilisync
  - docs
  - README.md
  - CHANGELOG.md
